services:
  db:
    image: postgres:16-alpine
    container_name: starboard-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - starboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: starboard-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    command: >
      sh -c "npm install && npm run prisma:generate && npm run prisma:deploy && npm run dev -- --webpack -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
      - "6006:6006"
    volumes:
      - ./:/app
      - starboard_node_modules:/app/node_modules
      - starboard_next_cache:/app/.next

volumes:
  starboard_db_data:
  starboard_node_modules:
  starboard_next_cache:
