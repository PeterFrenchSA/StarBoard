services:
  db:
    image: postgres:16-alpine
    container_name: starboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starboard}
      POSTGRES_USER: ${POSTGRES_USER:-starboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starboard}
    ports:
      - "5432:5432"
    volumes:
      - starboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starboard} -d ${POSTGRES_DB:-starboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: starboard-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://starboard:starboard@db:5432/starboard?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://starboard:starboard@db:5432/starboard?schema=public}
    command: >
      sh -c "npm install && npm run prisma:generate && npm run prisma:deploy && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - starboard_node_modules:/app/node_modules

volumes:
  starboard_db_data:
  starboard_node_modules:
