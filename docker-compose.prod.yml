services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starboard}
      POSTGRES_USER: ${POSTGRES_USER:-starboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - starboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starboard} -d ${POSTGRES_DB:-starboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      APP_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      VOICE_TOKEN_SALT: ${VOICE_TOKEN_SALT}
    ports:
      - "3000:3000"

volumes:
  starboard_db_data:
