services:
  db:
    image: postgres:16-alpine
    container_name: starboard-db-prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starboard}
      POSTGRES_USER: ${POSTGRES_USER:-starboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - starboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starboard} -d ${POSTGRES_DB:-starboard}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - starboard_net

  app:
    container_name: starboard-app-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      APP_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      VOICE_TOKEN_SALT: ${VOICE_TOKEN_SALT}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/auth/me').then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - starboard_net

volumes:
  starboard_db_data:

networks:
  starboard_net:
    name: starboard_net
